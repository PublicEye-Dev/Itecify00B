services:
  postgres:
    image: postgres:16-alpine
    container_name: itecify-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itecify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itecify}
      POSTGRES_DB: ${POSTGRES_DB:-itecify}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Run api/web/collab on the host with `pnpm dev` (fastest iteration).
  # Extend this file later with containerized apps if needed.

volumes:
  postgres_data:
