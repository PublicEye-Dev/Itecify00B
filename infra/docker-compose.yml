services:
  postgres:
    image: postgres:16
    container_name: itecify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: itecify
    ports:
      - "5432:5432"
    volumes:
      - itecify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d itecify"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  itecify_postgres_data:
